pluginManagement {
	resolutionStrategy {
		eachPlugin({
			if (requested.id.namespace == 'net.minecraftforge')
				it.useModule(group: 'net.minecraftforge.gradle', name:'ForgeGradle', version: '6.0.+')
			if (requested.id.namespace == 'org.spongepowered')
				it.useModule(group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT')
			if (requested.id.namespace == 'org.parchmentmc.librarian')
				it.useModule(group: 'org.parchmentmc', name: 'librarian', version: '1.2.0')
		})
	}
	repositories {
		mavenLocal()
		gradlePluginPortal()
		maven { url 'https://repo.spongepowered.org/maven' }
		maven { url "https://maven.minecraftforge.net" }
		maven { url "https://plugins.gradle.org/m2" }
		maven { url "https://maven.shedaniel.me/" }
		maven { url 'https://maven.parchmentmc.org' }
		mavenCentral()
	}
}

rootProject.name = 'Origins'

include 'calio'
include 'apoli'
include 'origins'

// ⚠⚠ **当部が足した（2026-09-08）。`origins-classes` をソースから建てるため。**
// ⚠ それまで `build_bundle.py` は**退避先の配布 jar** を採っており、
//   ⚠⚠ **power を直す口が datapack の上書きしか無かった**
//   （その写しは `_resolve_power()` が先に読むので、MOD 側を直しても届かない）。
// ⚠ `origins-classes/build.gradle` は消した——ルートの `subprojects { }` が見るため。
include 'origins-classes'
